local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts: ["localhost", "127.0.0.1"]

backend:
  name: github
  repo: nandorifky/acaranya
  branch: main
  base_url: https://sveltia.mr-winando.workers.dev
  auth_endpoint: /auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "design-categories"
    label: "Kategori Desain"
    folder: "src/content/design-categories"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Nama Kategori (Label)", name: "title", widget: "string" }
      - { label: "Label Singkat (untuk menu)", name: "labelShort", widget: "string" }
      - { label: "Icon Name (Lucide)", name: "icon", widget: "string", description: "Contoh: gem, cake, building, etc." }
      - { label: "Deskripsi Ringkas", name: "description", widget: "text" }
      - { label: "Meta SEO Title", name: "metaTitle", widget: "string" }
      - { label: "Meta SEO Description", name: "metaDescription", widget: "text" }
      - { label: "Urutan Tampil", name: "sortOrder", widget: "number", value_type: "int", default: 0 }
      - { label: "Status Publikasi", name: "status", widget: "select", options: ["draft", "published"], default: "published" }
      - { label: "Custom Hero Title (H1)", name: "heroTitle", widget: "string", required: false }
      - { label: "Custom Hero Subtitle", name: "heroSubtitle", widget: "text", required: false }
      - label: "Bagian Kenapa Memilih Kami (Opsional)"
        name: "whyChooseUs"
        widget: "object"
        required: false
        fields:
          - { label: "Judul Bagian", name: "title", widget: "string", required: false }
          - { label: "Sub-judul", name: "subtitle", widget: "text", required: false }
          - { label: "Gambar Placeholder", name: "image", widget: "image", required: false }
          - label: "Daftar Keunggulan"
            name: "features"
            widget: "list"
            required: false
            fields:
              - { label: "Judul Keunggulan", name: "title", widget: "string" }
              - { label: "Deskripsi", name: "description", widget: "text" }
              - { label: "Icon Name (Lucide)", name: "icon", widget: "string", description: "Contoh: check-circle, zap, shield-check" }
      - { label: "Custom CTA Title", name: "ctaTitle", widget: "string", required: false }
      - { label: "Custom CTA Subtitle", name: "ctaSubtitle", widget: "text", required: false }
      - { label: "Konten SEO (Body)", name: "body", widget: "markdown", buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "heading-three", "heading-four", "heading-five", "heading-six", "quote", "bulleted-list", "numbered-list", "image"] }

  - name: "designs"
    label: "Katalog Desain"
    folder: "src/content/designs"
    create: true
    path: "{{category}}/{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Nama Template Desain", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "relation", collection: "design-categories", value_field: "{{slug}}", display_fields: ["title"], search_fields: ["title"] }
      - { label: "Gambar Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Tautan Live Preview", name: "previewUrl", widget: "string", description: "Contoh: https://inv.acaranya.id/nama-desain" }
      - { label: "Tampilkan di Unggulan?", name: "isFeatured", widget: "boolean", default: false }
      - { label: "Desain Premium?", name: "isPremium", widget: "boolean", default: false }
      - { label: "Tags / Label", name: "tags", widget: "list", default: [] }
      - { label: "Paket Investasi", name: "package", widget: "select", options: ["simple", "mengundang", "meriah"], required: false }
      - { label: "Urutan Pengurutan (Sort Order)", name: "sortOrder", widget: "number", value_type: "int", default: 0 }
      - { label: "Status Publikasi", name: "status", widget: "select", options: ["draft", "published"], default: "published" }

  - name: "blog"
    label: "Artikel Blog"
    folder: "src/content/blog"
    media_folder: "/public/images/blog/content"
    public_folder: "/images/blog/content"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }
      - { label: "Tanggal Rilis", name: "publishedAt", widget: "datetime" }
      - { label: "Tanggal Diperbarui", name: "updatedAt", widget: "datetime", required: false }
      - { label: "Penulis (Author)", name: "author", widget: "relation", collection: "authors", value_field: "{{slug}}", search_fields: ["name"], display_fields: ["name"] }
      - { label: "Kategori Blog", name: "category", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - label: "Gambar Utama (Featured Image)"
        name: "image"
        widget: "image"
        media_folder: "/public/images/blog/featured"
        public_folder: "/images/blog/featured"
        required: false
      - { label: "Alt Text Gambar", name: "imageAlt", widget: "string", required: false }
      - { label: "Judul Gambar (Title Tag)", name: "imageTitle", widget: "string", required: false }
      - { label: "Keterangan Gambar (Caption)", name: "imageCaption", widget: "string", required: false }
      - { label: "Status Publikasi", name: "status", widget: "select", options: ["draft", "published"], default: "published" }
      - { label: "SEO Custom Title (Optional)", name: "seoTitle", widget: "string", required: false }
      - { label: "Custom Breadcrumb Label (Optional)", name: "customBreadcrumbLabel", widget: "string", required: false }
      - { label: "Canonical URL (Optional)", name: "canonicalUrl", widget: "string", required: false }
      - { label: "Noindex Tag? (Sembunyikan dari Google)", name: "noindex", widget: "boolean", default: false }
      - { label: "Isi Konten Artikel (Body)", name: "body", widget: "markdown", buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "heading-three", "heading-four", "heading-five", "heading-six", "quote", "bulleted-list", "numbered-list", "image"] }


  - name: "testimonials"
    label: "Ulasan Pelanggan (Testimonial)"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Nama Pelanggan", name: "name", widget: "string" }
      - { label: "Deskripsi Acara", name: "eventType", widget: "string", description: "Contoh: Pernikahan di Surabaya" }
      - { label: "Pesan / Ulasan", name: "message", widget: "text" }
      - { label: "Rating Bintang", name: "rating", widget: "number", value_type: "int", min: 1, max: 5 }
      - { label: "Foto Pelanggan", name: "image", widget: "image", required: false }
      - { label: "Status Publikasi", name: "status", widget: "select", options: ["draft", "published"], default: "published" }

  - name: "faqs"
    label: "Tanya Jawab (FAQ)"
    folder: "src/content/faqs"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Pertanyaan (Question)", name: "question", widget: "string" }
      - { label: "Jawaban (Answer)", name: "answer", widget: "text" }
      - { label: "Kategori FAQ", name: "category", widget: "string" }
      - { label: "Urutan Tampil", name: "sortOrder", widget: "number", value_type: "int", default: 0 }
      - { label: "Status Publikasi", name: "status", widget: "select", options: ["draft", "published"], default: "published" }

  - name: "authors"
    label: "Penulis (Authors)"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Nama Penulis", name: "name", widget: "string" }
      - { label: "Peran / Jabatan", name: "role", widget: "string" }
      - { label: "Biografi Singkat", name: "bio", widget: "text" }
      - { label: "Foto Profil (Avatar)", name: "avatar", widget: "image", required: false }
      - { label: "Twitter Username", name: "socialTwitter", widget: "string", required: false }
      - { label: "Instagram Username", name: "socialInstagram", widget: "string", required: false }
      - { label: "Facebook Link", name: "socialFacebook", widget: "string", required: false }
      - { label: "Linkedin Link", name: "socialLinkedin", widget: "string", required: false }
      - { label: "Github Username", name: "socialGithub", widget: "string", required: false }
      - { label: "Website Pribadi", name: "socialWebsite", widget: "string", required: false }
      - { label: "Meta SEO Title (Optional)", name: "metaTitle", widget: "string", required: false }
      - { label: "Meta SEO Description (Optional)", name: "metaDescription", widget: "string", required: false }

  - name: "tools"
    label: "Alat Bantu (Tools)"
    folder: "src/content/tools"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Judul Halaman Tool", name: "title", widget: "string" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }
      - { label: "Icon Name (Lucide)", name: "icon", widget: "string", required: false, description: "Contoh: heart, clock, calendar, sparkles, dsb." }
      - label: "Pilih Komponen Tool"
        name: "toolComponent"
        widget: "select"
        options:
          - { label: "Kalkulator Weton Online (CekWeton)", value: "CekWeton" }
          - { label: "Hitung Mundur Pernikahan (WeddingCountdown)", value: "WeddingCountdown" }
      - { label: "Tanggal Rilis", name: "publishedAt", widget: "datetime", required: false }
      - { label: "Status Publikasi", name: "status", widget: "select", options: ["draft", "published"], default: "published" }
      - { label: "SEO Custom Title (Optional)", name: "seoTitle", widget: "string", required: false }
      - { label: "Canonical URL (Optional)", name: "canonicalUrl", widget: "string", required: false }
      - { label: "Noindex Tag? (Sembunyikan dari Google)", name: "noindex", widget: "boolean", default: false }
      # SoftwareApplication Schema Fields
      - { label: "Skema: Nama Software/Tool", name: "schemaSoftwareName", widget: "string", default: "Cek Weton Online Acaranya.id", required: false }
      - { label: "Skema: OS Aplikasi", name: "schemaOperatingSystem", widget: "string", default: "All", required: false }
      - { label: "Skema: Kategori Aplikasi", name: "schemaApplicationCategory", widget: "string", default: "WebApplication", required: false }
      - { label: "Skema: Harga (0 jika gratis)", name: "schemaOffersPrice", widget: "string", default: "0", required: false }
      - { label: "Skema: Mata Uang (IDR dll)", name: "schemaOffersPriceCurrency", widget: "string", default: "IDR", required: false }
      - { label: "Isi Konten Artikel Panduan (Body)", name: "body", widget: "markdown", buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "heading-three", "heading-four", "heading-five", "heading-six", "quote", "bulleted-list", "numbered-list", "image"] }
